##
## db config - H2 in-memory database for local development
##

# H2 in-memory database configuration
db.jdbcUrl=jdbc\:h2\:mem\:SALESMANAGER;AUTOCOMMIT=OFF;mv_store=false;INIT\=CREATE SCHEMA IF NOT EXISTS SALESMANAGER
db.user=sa
db.password=
db.driverClass=org.h2.Driver
hibernate.dialect=org.hibernate.dialect.H2Dialect

db.show.sql=false
db.preferredTestQuery=SELECT 1
db.schema=SALESMANAGER
hibernate.hbm2ddl.auto=update

##
## configuration pooling
##
db.initialPoolSize=4
db.minPoolSize=4
db.maxPoolSize=8
